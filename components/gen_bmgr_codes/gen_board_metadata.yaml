version: 1
board: jc1060p470_i_w_y
chip: esp32p4

devices:
  audio_dac:
    type: audio_codec
    peripherals:
    - gpio_pa_control
    - i2s_audio_out
    - i2c_master

  audio_adc:
    type: audio_codec
    peripherals:
    - i2s_audio_in
    - i2c_master

  display_lcd:
    type: display_lcd
    sub_type: dsi
    peripherals:
    - ldo_mipi
    - dsi_display
    dependencies:
      espressif/esp_lcd_jd9165: ^2.0.2
    io:
      reset_gpio_num: 0

  lcd_touch:
    type: lcd_touch
    sub_type: i2c
    peripherals:
    - i2c_master
    dependencies:
      espressif/esp_lcd_touch_gt911: '*'

  camera:
    type: camera
    sub_type: csi
    peripherals:
    - i2c_master
    - ldo_mipi

  lcd_brightness:
    type: ledc_ctrl
    peripherals:
    - ledc_backlight

  fs_sdcard:
    type: fs_fat
    sub_type: sdmmc
    io:
      clk: 43
      cmd: 44
      d0: 39
      d1: 40
      d2: 41
      d3: 42

peripherals:
  i2c_master:
    type: i2c
    role: master
    io:
      sda_io_num: 7
      scl_io_num: 8

  i2s_audio_out:
    type: i2s
    role: master
    format: tdm-out
    io:
      mclk: 13
      bclk: 12
      ws: 10
      dout: 9
      din: 48

  i2s_audio_in:
    type: i2s
    role: master
    format: tdm-in
    io:
      mclk: 13
      bclk: 12
      ws: 10
      dout: 9
      din: 48

  gpio_pa_control:
    type: gpio
    role: io
    io:
      pin: 11

  ldo_mipi:
    type: ldo

  dsi_display:
    type: dsi

  ledc_backlight:
    type: ledc
    io:
      gpio_num: 23

  uart_1:
    type: uart
    io:
      tx_io_num: 26
      rx_io_num: 27
